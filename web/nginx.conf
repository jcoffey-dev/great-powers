server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
